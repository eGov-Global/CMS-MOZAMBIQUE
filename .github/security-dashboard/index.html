<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Dashboard — Ansible Remote Server Deployment</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
 --bg:#eef1f7; --surface:#fff; --surface-2:#f7f9fc; --surface-3:#f1f4f9;
 --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --faint:#94a3b8;
 --line:#e6eaf2; --line-2:#d9dfec;
 --brand:#123a5e; --link:#2563eb; --link-hover:#1d4ed8;
 --crit:#7f1d1d; --high:#e11d48; --med:#f59e0b; --low:#3b82f6; --info:#94a3b8;
 --p1:#dc2626; --p2:#d97706; --p3:#64748b;
 --sh-sm:0 1px 2px rgba(15,23,42,.06);
 --sh:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.06);
 --sh-lg:0 12px 34px rgba(15,23,42,.16);
 --r:16px; --r-sm:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,#e9edf5 0%,var(--bg) 240px);color:var(--ink);
 font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:26px 24px 80px}
a{color:var(--link);text-decoration:none}a:hover{color:var(--link-hover);text-decoration:underline}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------- header ---------- */
header.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:4px 2px 18px}
.brand{display:flex;align-items:center;gap:13px}
.brand .logo{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;
 background:linear-gradient(135deg,#1e3a5f,#2563eb);box-shadow:var(--sh-sm)}
.brand .logo svg{width:23px;height:23px;color:#fff}
h1{font-size:20px;margin:0;color:var(--brand);letter-spacing:-.01em;font-weight:800}
.scope{color:var(--muted);font-size:12.5px;margin-top:1px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer;
 user-select:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;box-shadow:var(--sh-sm)}
.toggle input{margin:0;accent-color:var(--link)}
.btn{font:inherit;font-size:13px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
 color:var(--ink);cursor:pointer;box-shadow:var(--sh-sm);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn.primary{background:#0f766e;border-color:#0f766e;color:#fff}
.btn.primary:hover{background:#0e6b63}
.btn svg{width:15px;height:15px}

/* ---------- custom report selector ---------- */
.rsel{position:relative}
.rsel-btn{font:inherit;font-size:13px;min-width:230px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;
 background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:var(--sh-sm);display:flex;align-items:center;gap:10px;transition:.15s}
.rsel-btn:hover{border-color:var(--line-2)}
.rsel-btn[aria-expanded="true"]{border-color:var(--link);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.rsel-btn .cap{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700}
.rsel-btn .lab{flex:1;text-align:left;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsel-btn .chev{width:15px;height:15px;color:var(--muted);flex:none;transition:transform .18s}
.rsel-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.rsel-menu{position:absolute;top:calc(100% + 8px);right:0;width:330px;max-height:376px;overflow-y:auto;overscroll-behavior:contain;
 background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--sh-lg);z-index:60;padding:6px}
.rsel-menu::-webkit-scrollbar{width:10px}
.rsel-menu::-webkit-scrollbar-thumb{background:#cdd5e3;border-radius:8px;border:3px solid var(--surface)}
.rsel-head{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;padding:8px 10px 4px}
.rsel-item{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;background:none;cursor:pointer;
 padding:9px 11px;border-radius:9px;color:var(--ink);position:relative}
.rsel-item:hover{background:var(--surface-3)}
.rsel-item[aria-selected="true"]{background:#eaf1fe}
.rsel-item[aria-selected="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--link)}
.rsel-when{font-size:13px;font-weight:600}
.rsel-sub{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rsel-dot{width:6px;height:6px;border-radius:50%;background:#cbd5e1}
.rsel-tag{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#0e7490;background:#cffafe;
 border:1px solid #a5f3fc;border-radius:5px;padding:1px 6px;margin-left:6px}

/* ---------- posture + meta ---------- */
.posture{display:inline-flex;align-items:center;gap:7px;padding:4px 13px;border-radius:999px;color:#fff;font-weight:700;font-size:12px;box-shadow:var(--sh-sm)}
.posture .pdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.9)}
.metabar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--surface);
 border:1px solid var(--line);border-radius:999px;padding:5px 12px;box-shadow:var(--sh-sm)}
.chip .k{color:var(--faint);font-size:11px}
.chip b{color:var(--ink);font-weight:650}

/* ---------- sections ---------- */
section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh)}
.stack>section+section, .stack>*+*{margin-top:16px}
.h2{display:flex;align-items:center;gap:9px;margin:0 0 15px}
.h2 .t{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:750}
.h2 .bar{width:16px;height:3px;border-radius:3px;background:linear-gradient(90deg,#2563eb,#4f46e5)}
.h2 .ai{font-size:10.5px;font-weight:700;color:#6d28d9;background:#f3e8ff;border:1px solid #e9d5ff;border-radius:999px;padding:1px 8px;letter-spacing:.02em}
.h2 .count{margin-left:auto;font-size:12px;color:var(--faint);font-weight:650}

.exec{font-size:14.5px;color:var(--ink-2);line-height:1.7}
.prilist{margin:0;padding:0;list-style:none;counter-reset:pa}
.prilist li{position:relative;padding:9px 0 9px 40px;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-2);line-height:1.55}
.prilist li:last-child{border-bottom:0}
.prilist li::before{counter-increment:pa;content:counter(pa);position:absolute;left:0;top:9px;width:25px;height:25px;
 border-radius:8px;background:#eff4ff;color:#1d4ed8;font-weight:800;font-size:12px;display:grid;place-items:center;border:1px solid #dbe6fe}

.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:16px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}

/* risk summary */
.rsub{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.sevrow{display:flex;align-items:center;font-size:14.5px;margin-top:14px}
.sevrow .hdot{width:9px;height:9px;border-radius:3px;margin-right:9px}
.sevrow b{font-weight:700}.sevrow .sevn{color:var(--faint);margin-left:6px;font-weight:600}
.catlist{list-style:none;margin:7px 0 0;padding:0 0 0 18px}
.catlist li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.catlist li:last-child{border-bottom:0}
.catlist .ct{flex:0 1 auto;color:var(--ink-2)}
.catlist .cn{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;background:#0f172a;color:#fff;border-radius:999px;padding:1px 10px;font-size:11.5px}
.tag{font-size:10.5px;color:var(--muted);background:var(--surface-3);border:1px solid var(--line);border-radius:6px;padding:1px 7px}

.chartbox{position:relative;height:236px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted);justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}

table.area{width:100%;border-collapse:collapse;font-size:13px}
table.area td{padding:9px 6px;border-bottom:1px solid var(--line)}
table.area tr:last-child td{border-bottom:0}
table.area td.r{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}

/* ---------- findings ---------- */
.finding{border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-top:13px;background:var(--surface);transition:.15s}
.finding:hover{border-color:var(--line-2);box-shadow:var(--sh-sm)}
.finding.fa{border-left:3px solid var(--high)}
.finding .h{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.finding .t{font-weight:700;font-size:15px;letter-spacing:-.005em}
.sev{display:inline-block;color:#fff;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.sev.LOW{color:#fff}.sev.INFO{color:#0f172a}
.pri{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:7px;color:#fff;white-space:nowrap}
.pri.P1{background:var(--p1)}.pri.P2{background:var(--p2)}.pri.P3{background:var(--p3)}
.stat{font-size:10.5px;font-weight:750;padding:2px 9px;border-radius:999px;white-space:nowrap}
.stat.act{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.stat.acc{background:#eef2f7;color:#475569;border:1px solid #e2e8f0}
.stat.fp{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.cnt{margin-left:auto;background:#0f172a;color:#fff;border-radius:999px;padding:2px 11px;font-size:12px;font-variant-numeric:tabular-nums;font-weight:650}
.rule{color:var(--muted);font-size:12px;margin-top:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rule code{background:var(--surface-3);padding:1px 6px;border-radius:5px;font-size:11.5px}
.rule .sep{color:var(--line-2)}
.rtag{font-size:10.5px;color:var(--muted);background:var(--surface-3);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.aitag{color:#7c3aed;font-weight:700;font-size:11.5px}
.wf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}
@media(max-width:640px){.wf{grid-template-columns:1fr}}
.wf .b{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.55;color:var(--ink-2)}
.wf .b .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:5px;font-weight:700;display:flex;align-items:center;gap:8px}
.wf .b code{background:#eef1f7;padding:1px 5px;border-radius:5px;font-size:12px}
.vf{font-size:10.5px;font-weight:750;padding:1px 8px;border-radius:999px;text-transform:none;letter-spacing:0}
.vf.ok{background:#dcfce7;color:#166534}.vf.nr{background:#fef3c7;color:#92400e}
.loc1{margin-top:12px;font-size:13px;color:var(--muted)}
details.loc{margin-top:9px}
details.loc>summary{cursor:pointer;color:var(--link);font-size:12.5px;font-weight:600;list-style:none}
details.loc>summary::-webkit-details-marker{display:none}
details.loc>summary::before{content:"▸ ";color:var(--faint)}
details.loc[open]>summary::before{content:"▾ "}
ul.locs{margin:9px 0 0;padding:0;list-style:none;max-height:340px;overflow:auto}
ul.locs li{padding:4px 0;border-bottom:1px dashed var(--line)}
ul.locs code{font-size:12px}
details.grp{margin-top:20px}
details.grp>summary{cursor:pointer;font-weight:700;color:var(--ink-2);font-size:13.5px;list-style:none;display:flex;align-items:center;gap:8px;
 padding:11px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .cx{margin-left:auto;color:var(--faint);font-size:12px;font-weight:600}
.grouptitle{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:750;margin:2px 0 4px}
.muted{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:36px}
.foot{color:var(--muted);font-size:11.5px;margin-top:28px;line-height:1.75;border-top:1px solid var(--line);padding-top:16px}

@media print{
 body{background:#fff}.controls,.btn,.toggle,.rsel{display:none!important}
 section{box-shadow:none;break-inside:avoid}.finding{break-inside:avoid}
 details[open]>*{display:revert}details>ul,details>div{display:block}
}
</style>
</head>
<body>
<div class="wrap stack">
 <header class="top">
  <div class="brand">
   <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
   <div>
    <h1>Security Dashboard</h1>
    <div class="scope" id="scope">Ansible Deployment — Remote Server</div>
   </div>
  </div>
  <div class="controls">
   <span class="posture" id="posture" style="display:none"><span class="pdot"></span><span id="postureTxt">—</span></span>
   <label class="toggle"><input type="checkbox" id="fpToggle" checked onchange="renderFindings()"> Hide non-actionable</label>
   <a class="btn primary" id="xlsxBtn" href="#" download style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l4-4m-4 4l-4-4M5 21h14"/></svg>Export audit</a>
   <div class="rsel" id="rsel">
    <button class="rsel-btn" id="runBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
     <span class="cap">Report</span>
     <span class="lab" id="runBtnLabel">—</span>
     <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="rsel-menu" id="runMenu" role="listbox" aria-label="Select a report" hidden></div>
   </div>
   <button class="btn" onclick="window.print()">Print / PDF</button>
  </div>
 </header>

 <div class="metabar" id="metabar"></div>

 <section id="execWrap" style="display:none">
  <div class="h2"><span class="bar"></span><span class="t">Executive summary</span><span class="ai">AI</span></div>
  <div class="exec" id="exec"></div>
 </section>

 <section id="priWrap" style="display:none">
  <div class="h2"><span class="bar"></span><span class="t">Priority actions</span><span class="ai">AI</span></div>
  <ol class="prilist" id="priList"></ol>
 </section>

 <div class="grid">
  <section>
   <div class="h2"><span class="bar"></span><span class="t">Risk summary</span></div>
   <div id="riskHead"></div>
   <div id="highWrap"></div>
  </section>
  <section>
   <div class="h2"><span class="bar"></span><span class="t">Findings by severity</span></div>
   <div class="chartbox"><canvas id="donut"></canvas></div>
   <div class="legend" id="donutLegend"></div>
  </section>
 </div>

 <section>
  <div class="h2"><span class="bar"></span><span class="t">Trend across reports</span><span class="count" id="trendNote"></span></div>
  <div class="chartbox" style="height:288px"><canvas id="trend"></canvas></div>
 </section>

 <section>
  <div class="h2"><span class="bar"></span><span class="t">Findings by area</span></div>
  <table class="area" id="areaTable"></table>
 </section>

 <section>
  <div class="grouptitle" id="prioTitle">Action required</div>
  <div id="prio"></div>
  <div id="hardWrap"></div>
 </section>

 <div class="foot" id="foot"></div>
</div>

<script>
const SEV=["CRITICAL","HIGH","MEDIUM","LOW","INFO"];
const COL={CRITICAL:"#7f1d1d",HIGH:"#e11d48",MEDIUM:"#f59e0b",LOW:"#3b82f6",INFO:"#94a3b8"};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s?s[0]+s.slice(1).toLowerCase():s;
const fmtTime=ts=>{try{return ts?new Date(ts).toLocaleString(undefined,{year:'numeric',month:'short',day:'2-digit',hour:'numeric',minute:'2-digit',hour12:true,timeZoneName:'short'}):"";}catch(e){return ts||"";}};
const fmtShort=ts=>{try{return ts?new Date(ts).toLocaleString(undefined,{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):"";}catch(e){return ts||"";}};
const PRO={P1:0,P2:1,P3:2,"":3};
const statusOf=f=>(f.triage||{}).status||"action_required";
const prioOf=f=>(f.triage||{}).priority||(statusOf(f)==="action_required"?"P2":"");
let donutChart,trendChart,CUR=null,RUNS=[],RUNI=0;

async function boot(){
  let manifest;
  try{ manifest=await (await fetch("manifest.json",{cache:"no-store"})).json(); }
  catch(e){ document.querySelector(".wrap").innerHTML='<p class="empty">No reports published yet.</p>'; return; }
  RUNS=manifest.runs||[];
  if(!RUNS.length){ $("prio").innerHTML='<p class="empty">No reports published yet.</p>'; return; }
  buildSelector();
  drawTrend(RUNS);
  selectRun(0);
}

/* ---- custom report selector (last 20, scrollable) ---- */
function buildSelector(){
  const list=RUNS.slice(0,20);
  $("runMenu").innerHTML=`<div class="rsel-head">Recent reports (${list.length}${RUNS.length>20?` of ${RUNS.length}`:""})</div>`+
    list.map((r,i)=>{
      const pr=r.pr?`PR #${r.pr.number}`:"";
      const tag=i===0?`<span class="rsel-tag">Latest</span>`:"";
      const bits=[esc(r.branch),pr,`${r.occurrences} occ`].filter(Boolean);
      return `<button class="rsel-item" role="option" data-i="${i}" aria-selected="${i===0}">
        <span class="rsel-when">${esc(fmtTime(r.ts)||r.date)}${tag}</span>
        <span class="rsel-sub">${bits.map((b,j)=>`${j?'<span class="rsel-dot"></span>':''}<span>${b}</span>`).join("")}</span>
      </button>`;
    }).join("");
  $("runMenu").querySelectorAll(".rsel-item").forEach(el=>el.onclick=()=>{selectRun(+el.dataset.i);closeMenu();});
}
function selectRun(i){
  RUNI=i;
  $("runBtnLabel").textContent=fmtTime(RUNS[i].ts)||RUNS[i].date;
  $("runMenu").querySelectorAll(".rsel-item").forEach((el,j)=>el.setAttribute("aria-selected",j===i));
  loadRun(RUNS[i].file);
}
function openMenu(){$("runMenu").hidden=false;$("runBtn").setAttribute("aria-expanded","true");
  const cur=$("runMenu").querySelector('[aria-selected="true"]'); if(cur) cur.scrollIntoView({block:"nearest"});}
function closeMenu(){$("runMenu").hidden=true;$("runBtn").setAttribute("aria-expanded","false");}
$("runBtn").onclick=e=>{e.stopPropagation();$("runMenu").hidden?openMenu():closeMenu();};
document.addEventListener("click",e=>{if(!$("rsel").contains(e.target))closeMenu();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu();});

async function loadRun(file){
  let d; try{ d=await (await fetch(file,{cache:"no-store"})).json(); }catch(e){ return; }
  const m=d.meta,s=d.summary;
  const highOcc=(s.occBySeverity.CRITICAL||0)+(s.occBySeverity.HIGH||0);
  const p=$("posture"),pt=$("postureTxt"); p.style.display="";
  if(s.occurrences===0){pt.textContent="No issues";p.style.background="#16a34a";}
  else if(highOcc){pt.textContent="Action required";p.style.background="#b91c1c";}
  else{pt.textContent="Review recommended";p.style.background="#b45309";}
  $("scope").textContent=m.scope||"Ansible Deployment — Remote Server";
  const commit=`<a href="https://github.com/${m.repo}/commit/${m.sha}" target="_blank" rel="noopener"><b>${esc(m.shaShort)}</b></a>`;
  const prLink=m.pr?`<span class="chip"><span class="k">PR</span><a href="${m.pr.url}" target="_blank" rel="noopener"><b>#${m.pr.number}</b></a></span>`:"";
  $("metabar").innerHTML=
    `<span class="chip"><span class="k">Repo</span><b>${esc(m.repo)}</b></span>`+
    `<span class="chip"><span class="k">Branch</span><b>${esc(m.branch)}</b></span>`+
    `<span class="chip"><span class="k">Commit</span>${commit}</span>${prLink}`+
    `<span class="chip"><span class="k">Scanned</span><b>${esc(fmtTime(m.ts)||m.date)}</b></span>`+
    `<span class="chip"><span class="k">Scanners</span><b>${(m.scanners||[]).join(" + ")}</b></span>`+
    `<span class="chip"><a href="${esc(m.runUrl)}" target="_blank" rel="noopener">workflow run ↗</a></span>`;
  const ew=$("execWrap");
  if(m.executive_summary){$("exec").textContent=m.executive_summary;ew.style.display="";}else ew.style.display="none";
  const pw=$("priWrap");
  if(Array.isArray(m.priority_actions)&&m.priority_actions.length){
    $("priList").innerHTML=m.priority_actions.map(a=>`<li>${esc(a)}</li>`).join("");pw.style.display="";
  } else pw.style.display="none";

  $("riskHead").innerHTML=`<div class="rsub">${s.types} issue types across ${s.occurrences} occurrences</div>`;
  const showSev=SEV.filter(sv=>(s.typesBySeverity[sv]||0)>0||sv==="CRITICAL"||sv==="HIGH");
  $("highWrap").innerHTML=showSev.map(sv=>{
    const n=s.typesBySeverity[sv]||0;
    const cats=(d.findings||[]).filter(f=>f.severity===sv).sort((a,b)=>b.count-a.count);
    let h=`<div class="sevrow"><span class="hdot" style="background:${COL[sv]}"></span><b>${cap(sv)}</b><span class="sevn">· ${n}</span></div>`;
    if(cats.length) h+=`<ul class="catlist">`+cats.map(f=>
      `<li><span class="ct">${esc(f.title)}</span><span class="tag">${esc(f.area)}</span><span class="cn">${f.count}</span></li>`).join("")+`</ul>`;
    return h;
  }).join("");
  drawDonut(s.occBySeverity);
  const byArea={};(d.findings||[]).forEach(f=>byArea[f.area]=(byArea[f.area]||0)+f.count);
  $("areaTable").innerHTML=Object.entries(byArea).sort((a,b)=>b[1]-a[1])
    .map(([a,n])=>`<tr><td>${esc(a)}</td><td class="r">${n}</td></tr>`).join("")||'<tr><td class="muted">None</td></tr>';

  const xb=$("xlsxBtn"),xlsx=(file||"").replace(/\.json$/,".xlsx");
  if(xlsx&&xlsx!==file){xb.href=xlsx;xb.style.display="";}else xb.style.display="none";

  CUR=d; renderFindings();
  const eng=m.engine?`triage, remediation & priority are ${esc(m.engine)}-generated, fail-safe dual-pass verified`:`remediation is curated`;
  $("foot").innerHTML=`Report-only mode · Count = times each rule matched · file links open the exact line on commit ${esc(m.shaShort)} · ${eng} · “Action required” is tracked in the Excel audit; acceptable &amp; false positives are documented but not tracked · per-location detail in Security → Code scanning.`;
}

function renderFindings(){
  const d=CUR; if(!d) return;
  const hideNon=($("fpToggle")||{}).checked;
  const all=d.findings||[];
  const action=all.filter(f=>statusOf(f)==="action_required")
    .sort((a,b)=>(PRO[prioOf(a)]-PRO[prioOf(b)])||(SEV.indexOf(a.severity)-SEV.indexOf(b.severity))||(b.count-a.count));
  const nontracked=all.filter(f=>statusOf(f)!=="action_required")
    .sort((a,b)=>(SEV.indexOf(a.severity)-SEV.indexOf(b.severity))||(b.count-a.count));
  $("prioTitle").innerHTML=`Action required <span class="muted">— ${action.length} issue type${action.length===1?"":"s"}</span>`;
  $("prio").innerHTML=action.map(f=>card(f,true)).join("")||'<p class="muted">No action-required findings. 🎉</p>';
  if(nontracked.length && !hideNon){
    $("hardWrap").innerHTML=`<details class="grp"><summary>Not tracked — acceptable &amp; false positives<span class="cx">${nontracked.length} issue types</span></summary>${nontracked.map(f=>card(f,false)).join("")}</details>`;
  } else $("hardWrap").innerHTML="";
}

function card(f,isAction){
  const locs=(f.locations||[]);
  const first=locs[0];
  const firstLink=first?`<a href="${esc(first.url)}" target="_blank" rel="noopener"><code>${esc(first.path)}:${esc(first.line||"")}</code></a>`:"";
  const list=locs.slice(0,80).map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener"><code>${esc(l.path)}:${esc(l.line||"")}</code></a></li>`).join("");
  const more=locs.length>80?`<li class="muted">and ${locs.length-80} more…</li>`:"";
  const det=locs.length>1?`<details class="loc"><summary>${locs.length} locations</summary><ul class="locs">${list}${more}</ul></details>`:"";
  const guide=f.guide?`<span class="sep">·</span><a href="${esc(f.guide)}" target="_blank" rel="noopener">reference ↗</a>`:"";
  const tr=f.triage||{}, st=tr.status, treason=esc(tr.reason||"");
  const pri = st==="action_required" ? `<span class="pri ${prioOf(f)}" title="Remediation priority">${prioOf(f)}</span>` : "";
  const stat = st==="action_required" ? `<span class="stat act" title="${treason}">Action required</span>`
            : st==="acceptable" ? `<span class="stat acc" title="${treason}">Acceptable</span>`
            : st==="false_positive" ? `<span class="stat fp" title="${treason}">False positive</span>` : "";
  const catT=f.category?`<span class="rtag" title="Category">${esc(f.category)}</span>`:"";
  const expo=(tr.exposure&&tr.exposure!=="unknown")?`<span class="rtag" title="Exposure">${esc(tr.exposure)}</span>`:"";
  const vf=f.verify;
  const vmark = vf ? (vf.verified ? `<span class="vf ok" title="Passed dual-pass review">✓ verified</span>`
                                  : `<span class="vf nr" title="${esc(vf.note||'flagged by a reviewer')}">⚠ needs review</span>`) : "";
  const aitag = f.enriched?`<span class="sep">·</span><span class="aitag" title="AI-generated remediation">✨ AI</span>`:'';
  return `<div class="finding${isAction?' fa':''}">
   <div class="h"><span class="sev ${f.severity}" style="background:${COL[f.severity]}">${cap(f.severity)}</span>${pri}
    <span class="t">${esc(f.title)}</span>${stat}<span class="cnt">×${f.count}</span></div>
   <div class="rule"><code>${esc(f.id)}</code><span class="sep">·</span>${esc(f.source)}<span class="sep">·</span>${esc(f.area)} ${catT}${expo}${guide}${aitag}</div>
   <div class="wf"><div class="b"><div class="k">Why it matters</div>${esc(f.why)}</div>
    <div class="b"><div class="k">How to fix ${vmark}</div>${esc(f.fix)}</div></div>
   <div class="loc1">First location: ${firstLink}</div>${det}
  </div>`;
}

function drawDonut(occ){
  const labels=SEV.filter(s=>occ[s]);const data=labels.map(s=>occ[s]);
  const cols=labels.map(s=>COL[s]);
  $("donutLegend").innerHTML=labels.map(s=>`<span><i class="dot" style="background:${COL[s]}"></i>${cap(s)} · <b>${occ[s]}</b></span>`).join("");
  if(donutChart)donutChart.destroy();
  donutChart=new Chart($("donut"),{type:"doughnut",
    data:{labels:labels.map(cap),datasets:[{data,backgroundColor:cols,borderColor:"#fff",borderWidth:3,hoverOffset:6}]},
    options:{cutout:"64%",plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${c.raw}`}}}}});
}

function drawTrend(runs){
  const r=runs.slice(0,20).reverse();               // oldest -> newest, last 20
  $("trendNote").textContent=`last ${r.length} · log scale`;
  const labels=r.map(x=>fmtShort(x.ts)||x.date);
  // most-severe first; keep only severities that ever occur so the log axis stays clean
  const active=SEV.filter(s=>r.some(x=>(x.occBySeverity?.[s]||0)>0));
  const ds=active.map(s=>({label:cap(s),data:r.map(x=>x.occBySeverity?.[s]||0),
    backgroundColor:COL[s],borderRadius:4,maxBarThickness:26,categoryPercentage:.72,barPercentage:.9}));
  if(trendChart)trendChart.destroy();
  trendChart=new Chart($("trend"),{type:"bar",data:{labels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,
     interaction:{mode:"index",intersect:false},
     scales:{
       x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,font:{size:10.5},color:"#64748b"}},
       y:{type:"logarithmic",min:1,grid:{color:"#eef2f7"},border:{display:false},
          ticks:{color:"#64748b",font:{size:10.5},callback:v=>([1,3,10,30,100,300,1000,3000].includes(v)?v:null)}}
     },
     plugins:{
       legend:{position:"top",align:"end",labels:{boxWidth:9,boxHeight:9,usePointStyle:true,pointStyle:"rectRounded",font:{size:11},padding:14}},
       tooltip:{callbacks:{
         title:items=>labels[items[0].dataIndex],
         label:c=>` ${c.dataset.label}: ${c.raw} occurrence${c.raw===1?"":"s"}`,
         footer:items=>{const t=items.reduce((a,b)=>a+(b.raw||0),0);return `Total: ${t}`;}
       }}
     }}});
}

boot();
</script>
</body>
</html>
