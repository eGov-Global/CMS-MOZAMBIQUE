name: Security Scan (Checkov)

# Full-repo IaC / DevOps / secrets scanning with a single tool (Checkov):
# Terraform, Helm charts, Kubernetes, Dockerfiles, docker-compose, Ansible,
# GitHub Actions workflows, and secrets. Scan settings live in .checkov.yaml.
# See .github/SECURITY-SCANNING.md for how to read results and turn on enforcement.
#
# Reports are rendered natively by GitHub in two places:
#   1. Security -> Code scanning tab (SARIF), plus inline annotations on PR diffs.
#   2. A visual summary card on each workflow run (the "Build report summary" step).

on:
  pull_request:
  push:
    branches: [master, develop]
  schedule:
    - cron: "0 3 * * 1" # weekly full scan, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # required to publish results to the Security tab
  pull-requests: read

jobs:
  checkov:
    name: Checkov full-repo scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml
          output_format: cli,sarif,json
          output_file_path: console,results.sarif,results.json

      - name: Upload SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Build report summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from collections import Counter
          try:
              data = json.load(open("results.json"))
          except Exception as e:
              print(f"> Checkov summary unavailable ({e}).")
              raise SystemExit(0)
          reports = data if isinstance(data, list) else [data]
          def s(r, k): return (r.get("summary") or {}).get(k, 0) or 0
          tp = sum(s(r, "passed") for r in reports)
          tf = sum(s(r, "failed") for r in reports)
          tk = sum(s(r, "skipped") for r in reports)
          fw = [r for r in reports if s(r, "passed") + s(r, "failed") + s(r, "skipped") > 0]

          print("## 🛡️ Checkov Security Scan\n")
          status = "✅ Clean" if tf == 0 else f"❌ {tf} failed"
          print(f"**{status}**  ·  ✅ {tp} passed  ·  ⏭️ {tk} skipped  ·  {len(fw)} frameworks\n")

          sec = next((r for r in reports if r.get("check_type") == "secrets"), None)
          if sec and s(sec, "failed") > 0:
              print(f"> 🔑 **{s(sec, 'failed')} potential secret(s) flagged** — review these first.\n")

          print("### Findings by area\n")
          print("| Area | ❌ Failed | ✅ Passed | |")
          print("|---|--:|--:|:--|")
          mx = max((s(r, "failed") for r in fw), default=0) or 1
          for r in sorted(fw, key=lambda r: -s(r, "failed")):
              bar = "█" * max(1, round(s(r, "failed") / mx * 12)) if s(r, "failed") else ""
              print(f"| {r.get('check_type','-')} | {s(r,'failed')} | {s(r,'passed')} | {bar} |")

          cnt, samp = Counter(), {}
          for r in reports:
              for c in ((r.get("results") or {}).get("failed_checks") or []):
                  cid = c.get("check_id", "?")
                  cnt[cid] += 1
                  samp.setdefault(cid, (c.get("check_name", ""), c.get("file_path", "")))
          if cnt:
              print("\n### Most frequent failing checks\n")
              print("| Count | Check | What it flags | Example file |")
              print("|--:|---|---|---|")
              for cid, n in cnt.most_common(12):
                  name, fp = samp[cid]
                  print(f"| {n} | `{cid}` | {(name or '').replace('|','/')} | `{fp}` |")

          print("\n_Full findings with file/line and triage: **Security → Code scanning** tab._")
          PY
