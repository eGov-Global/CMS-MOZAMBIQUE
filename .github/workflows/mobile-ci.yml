# CI for the Flutter mobile app under mobile/.
#
# Path-filtered so it only runs when the app (or this file) changes — the rest
# of the monorepo never pays for a Flutter toolchain download. Builds are
# UNSIGNED here by design: android/app/build.gradle.kts falls back to the debug
# signing config when key.properties is absent, so no secrets are needed on the
# PR path. Signed release builds live in mobile-build-apk.yml.
name: Mobile CI

on:
  pull_request:
    branches: [master, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with mobile-build-apk.yml and mobile/README.md.
  FLUTTER_VERSION: '3.38.7'

defaults:
  run:
    working-directory: mobile

jobs:
  ci:
    name: Analyze, test, build (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        # subosito/flutter-action v2.23.0 — third-party, pinned to a commit SHA.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build unsigned release APK (arm64)
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name "0.0.0-ci" \
            --build-number "${{ github.run_number }}"

      - name: Upload CI APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ci-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
