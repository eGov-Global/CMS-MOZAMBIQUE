name: Security Scan - Ansible Remote Server Deployment

# Security scanning for the Ansible remote-server deployment path
# (local-setup/#choose-your-setup-path: `./deploy.sh <tenant>`).
#
#   Checkov  -> Ansible deployment code (local-setup/ansible) - config hardening
#   KICS     -> docker-compose ports / protocols / privileged / host-network (with severities)
#
# Secret detection is handled by GitHub native secret scanning (lower false positives
# than entropy-based scanners), not Checkov.
#
# MANUAL trigger only: run it from Actions -> "Run workflow" and pick the branch in the
# dropdown. Both tools upload SARIF to Security -> Code scanning, and are merged into a
# per-run report published to the public dashboard (gh-pages). See .github/SECURITY-SCANNING.md.

on:
  workflow_dispatch:
    inputs:
      run_enrichment:
        description: "AI enrichment (Gemini): triage, validate labels/severity/priority. Uncheck for a RAW scanner-only report to compare."
        type: boolean
        default: true
      run_strix:
        description: "Also run the Strix AI pentest (deep source review, ~30-60 min, uses your ChatGPT plan)"
        type: boolean
        default: false

permissions:
  contents: write # push reports to gh-pages
  security-events: write # publish SARIF to the Security tab
  pull-requests: read

jobs:
  scan:
    name: Ansible remote-server security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Checkov - Ansible deployment code only (scoped to local-setup/ansible to avoid
      #    scanning Helm/k8s/devops, which produced entropy-based secret false positives)
      - name: Checkov (Ansible)
        if: always()
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: local-setup/ansible
          config_file: .checkov.yaml
          output_format: cli,sarif,json
          output_file_path: console,checkov.sarif,checkov.json

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov

      # 2) KICS - docker-compose misconfig (ports/protocols/privileged), with severities
      - name: KICS (docker-compose)
        if: always()
        # continue-on-error: the KICS *scan* succeeds and writes kics-results/, but the
        # action's annotation post-step installs Node at runtime and can crash on a
        # base-image/GLIBC mismatch. That must never fail the whole pipeline.
        continue-on-error: true
        uses: checkmarx/kics-github-action@v2
        with:
          path: "."
          platform_type: DockerCompose
          exclude_paths: "local-setup/k8s,devops,tests,node_modules"
          # Disable KICS secret detection (env-var false positives); secrets are
          # handled by GitHub native secret scanning. (exclude_categories with a
          # space in the name breaks the KICS CLI arg parsing.)
          disable_secrets: true
          output_path: "kics-results/"
          output_formats: "json,sarif"
          fail_on: ""
          ignore_on_exit: results
          # avoid the action's Node-based annotation/comment post-steps (the source of
          # the GLIBC crash) - we render findings from the JSON ourselves anyway.
          enable_annotations: false
          enable_comments: false
          enable_jobs_summary: false

      # KICS output filename can vary; make the SARIF path deterministic so the
      # upload never hard-fails on a missing file.
      - name: Normalize KICS outputs
        if: always()
        run: |
          echo "KICS output dir:"; ls -la kics-results/ 2>/dev/null || echo "(none)"
          mkdir -p kics-results
          # SARIF (for the Security tab) - must exist or the upload step hard-fails
          if [ ! -f kics-results/results.sarif ]; then
            found="$(find kics-results -name '*.sarif' 2>/dev/null | head -1 || true)"
            if [ -n "$found" ]; then
              cp "$found" kics-results/results.sarif; echo "copied $found -> results.sarif"
            else
              printf '%s' '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"KICS","rules":[]}},"results":[]}]}' > kics-results/results.sarif
              echo "no KICS sarif produced; wrote empty valid sarif"
            fi
          fi
          # JSON (feeds the dashboard) - locate it if KICS used a different name
          if [ ! -f kics-results/results.json ]; then
            fj="$(find kics-results -name '*.json' 2>/dev/null | head -1 || true)"
            [ -n "$fj" ] && cp "$fj" kics-results/results.json && echo "copied $fj -> results.json" || echo "no KICS json found"
          fi

      - name: Upload KICS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: kics-results/results.sarif
          category: kics

      # 2b) Ansible DRY-RUN + setup-specific custom rules.
      #  - syntax-check: proves the playbook + every referenced task/template parses.
      #  - ansible-lint with the repo config BYPASSED (-c /dev/null) so the security rules
      #    the repo's own .ansible-lint suppresses (risky-file-permissions, risky-shell-pipe,
      #    no-log-password) are re-enabled; only those security rules are fed into the report.
      #  - custom_rules.py: deterministic setup-specific checks (datastore 0.0.0.0 exposure,
      #    weak default creds, curl|bash, missing nginx headers, /mcp unauth, no host firewall).
      - name: Ansible dry-run and custom security rules
        if: always()
        env:
          ANSIBLE_DIR: local-setup/ansible
        run: |
          python3 -m pip install --quiet ansible-core ansible-lint 2>/dev/null || pip3 install --quiet ansible-core ansible-lint
          ansible-galaxy collection install -r "$ANSIBLE_DIR/requirements.yml" 2>&1 | tail -2 || true
          echo "::group::ansible syntax-check"
          ansible-playbook --syntax-check -i "$ANSIBLE_DIR/inventory.ini.example" "$ANSIBLE_DIR/playbook-deploy.yml" || echo "syntax-check reported issues (non-fatal)"
          echo "::endgroup::"
          echo "::group::ansible-lint (security rules re-enabled)"
          ansible-lint -c /dev/null --profile production -f sarif \
            "$ANSIBLE_DIR/playbook-deploy.yml" "$ANSIBLE_DIR/tasks" "$ANSIBLE_DIR/templates" "$ANSIBLE_DIR/deploy.sh" \
            > lint.sarif 2> lint.err || echo "ansible-lint completed with findings (expected)"
          echo "::endgroup::"
          BASE=. OUT=custom.json python3 .github/scripts/custom_rules.py || echo "custom rules skipped (non-fatal)"
          SARIF=lint.sarif OUT=custom.json ANSIBLE_PREFIX="$ANSIBLE_DIR" python3 .github/scripts/ansible_lint_to_findings.py || echo "lint conversion skipped (non-fatal)"

      # 2c) OPTIONAL Strix AI pentest (source-mode, no live target) - manual opt-in only.
      #  Uses your ChatGPT subscription via the STRIX_AUTH secret (no metered API cost).
      #  Deep, fresh scan of local-setup each run (no cache). Findings are converted and
      #  merged - overlaps enrich existing findings with CVSS/CWE, net-new are added.
      - name: Strix AI pentest (opt-in)
        if: ${{ always() && github.event.inputs.run_strix == 'true' }}
        timeout-minutes: 90
        env:
          STRIX_LLM: "chatgpt/gpt-5.4"
          STRIX_AUTH: ${{ secrets.STRIX_AUTH }}
        run: |
          if [ -z "$STRIX_AUTH" ]; then
            echo "::warning title=Strix skipped::run_strix was selected but the STRIX_AUTH secret is not set."
            {
              echo "### ⚠️ Strix selected but STRIX_AUTH secret is not set"
              echo ""
              echo "The Strix AI pentest was requested (\`run_strix: true\`) but no \`STRIX_AUTH\` secret is configured, so it was skipped."
              echo "This does **not** fail the scan - the rest of the report is complete. Add the \`STRIX_AUTH\` secret to enable Strix."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Pin the Strix version. The installer defaults to latest, and a release after
          # 1.5.3 regressed the model config (KeyError: 'agents.models' at LLM warm-up on
          # the chatgpt/gpt-5.4 subscription path). 1.5.3 is verified working.
          curl -sSL https://strix.ai/install | VERSION=1.5.3 bash
          export PATH="$HOME/.strix/bin:$PATH"
          strix --version
          mkdir -p ~/.strix
          printf '%s' "$STRIX_AUTH" | base64 -d > ~/.strix/subscription-auth.json
          chmod 600 ~/.strix/subscription-auth.json
          strix -n -t ./local-setup -m deep --scope-mode full 2>&1 | tee strix.log || echo "strix finished (findings or non-fatal)"
          SARIF="$(ls -t strix_runs/*/findings.sarif 2>/dev/null | head -1)"
          if [ -n "$SARIF" ]; then
            SARIF="$SARIF" OUT=custom.json STRIX_PREFIX=local-setup python3 .github/scripts/strix_to_findings.py
          elif grep -qiE "usage[_ ]?limit|rate[_ ]?limit|\b429\b|too many requests|quota" strix.log 2>/dev/null; then
            # ChatGPT Plus 5-hour rolling limit hit (not billing, not a pipeline failure).
            # Make it unmistakable in the job summary so a capped run isn't mistaken for an auth error.
            echo "::warning title=Strix skipped::ChatGPT 5-hour usage limit reached - re-run later."
            {
              echo "### ⚠️ Strix skipped: ChatGPT 5-hour usage limit reached"
              echo ""
              echo "The Strix AI pentest could not complete because the ChatGPT Plus **5-hour rolling usage limit** was hit."
              echo "This is **not** a billing charge and does **not** fail the scan - the rest of the report (Checkov, KICS, custom rules, Gemini enrichment) is complete."
              echo "Re-run the workflow with \`run_strix: true\` after the window resets (roughly 5 hours after the *previous* Strix run started)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no Strix SARIF produced (auth or scan issue); continuing without Strix findings."
          fi

      # 3) Merge into a structured run.json + summary card
      - name: Build report data
        if: always()
        env:
          CHECKOV_JSON: checkov.json
          CHECKOV_BASE: local-setup/ansible
          KICS_JSON: kics-results/results.json
          CUSTOM_JSON: custom.json
          OUT_JSON: run.json
          REPO: ${{ github.repository }}
          REF: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SCAN_SCOPE: "Ansible Deployment - Remote Server"
        run: python3 .github/scripts/security_report.py >> "$GITHUB_STEP_SUMMARY"

      # 3b) OPTIONAL: agentic enrichment via a free LLM (Google Gemini).
      # 5 stages: context -> triage (FP filter) -> remediate -> dual-pass verify ->
      # executive summary. Uses only Python stdlib. No-ops if GEMINI_API_KEY is unset.
      - name: Enrich report (Gemini agent pipeline, optional)
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          RUN_JSON: run.json
          CACHE_FILE: enrich-cache.json
          REPO: ${{ github.repository }}
        run: |
          # Explicit opt-out for a RAW comparison run, without deleting the secret.
          if [ "${{ github.event.inputs.run_enrichment }}" = "false" ]; then
            export GEMINI_API_KEY=""
            echo "run_enrichment=false — AI enrichment disabled for this run."
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ℹ️ RAW mode — scanner findings + curated remediation, no AI triage/validation/priority."
            echo "### ℹ️ AI enrichment OFF — raw scanner report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✨ AI enrichment ON — findings triaged, labels/severity/priority validated" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Never fails the pipeline: the script no-ops cleanly when the key is absent.
          python3 .github/scripts/enrich_report.py || echo "enrichment skipped (non-fatal)"

      # 3c) Build the multi-sheet audit workbook (Excel) for team tracking.
      # Tracks only action-required findings; acceptable/false-positive are documented
      # on a separate sheet, not in the tracking list.
      - name: Build audit workbook (Excel)
        if: always()
        env:
          RUN_JSON: run.json
          OUT_XLSX: security-audit.xlsx
        run: |
          python3 -m pip install --quiet openpyxl 2>/dev/null || pip3 install --quiet openpyxl
          python3 .github/scripts/build_audit_xlsx.py || echo "audit workbook skipped (non-fatal)"

      # 4) Publish to the public dashboard (gh-pages, keeps history)
      - name: Publish to public dashboard
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish_pages.sh

      - name: Upload run data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-data
          path: |
            run.json
            security-audit.xlsx
            strix_runs/
          if-no-files-found: warn
